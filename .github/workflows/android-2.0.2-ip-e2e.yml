name: android-2.0.2-end-to-end-ip

on:
  push:
    branches:
      - fix/android-linux-peer-presence
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  real-ip:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENRAD_E2E_APK: clients/android/app/build/outputs/apk/debug/app-debug.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - name: Build the corrected Android APK and execute tests
        working-directory: clients/android
        run: |
          ./scripts/setup-android-sdk.sh
          ./scripts/build.sh
          ./gradlew :app:testDebugUnitTest
      - name: Build matching Linux 2.0.2 CLI from the same commit
        run: |
          cargo build --release --locked -p openrad-client --bin openrad
          mkdir -p dist/e2e-binary/openrad-v2.0.2-linux-x86_64
          cp target/release/openrad dist/e2e-binary/openrad-v2.0.2-linux-x86_64/openrad
      - name: Setup isolated Linux TAP and ephemeral private test network
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2 iputils-ping gnome-keyring dbus-x11
          test -c /dev/net/tun
          chmod +x dist/e2e-binary/openrad-v2.0.2-linux-x86_64/openrad
          dbus-run-session -- bash -c 'printf "e2e-runner-temporary-keyring\\n" | gnome-keyring-daemon --unlock >/dev/null; python3 scripts/android-linux-ip-e2e.py prepare'
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android 14 emulator and exchange real IP packets with Linux
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 scripts/android-linux-ip-e2e.py android
      - name: Clean up private network and Linux TAP
        if: always()
        run: python3 scripts/android-linux-ip-e2e.py cleanup || true
      - name: Upload proof and diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrad-2.0.2-ip-e2e-results
          path: dist/android-ip-e2e-results/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload corrected debug APK for isolated testing only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrad-2.0.2-android-presence-fix-DEBUG-only
          path: clients/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 14



